<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300">
<defs>
<filter id="edge" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
<feColorMatrix type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 1 0"/>
</filter>
<filter id="paper" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
