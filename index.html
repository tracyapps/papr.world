<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencil and Paper Prototype</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div class="hud" aria-label="Prototype status">
        <div id="seed-store-interaction-prompt" class="hint maker-prompt" hidden>Visit Pip’s seed counter or press E</div>
      </div>
      <div id="hud-actions" class="hud-actions">
        <button id="hud-help" class="hud-icon-button" type="button" aria-label="Help and controls" aria-expanded="false">
          <span aria-hidden="true">?</span>
        </button>
        <button id="hud-settings" class="hud-icon-button" type="button" aria-label="Settings" aria-expanded="false">
          <span class="hud-icon-cog" aria-hidden="true"></span>
        </button>
      </div>
      <div id="mini-map-widget" class="mini-map hud-widget" aria-label="Explored paper map" data-hud-widget="miniMap">
        <div class="hud-drag-grip" aria-hidden="true"></div>
        <div id="mini-map-currently" class="mini-map-currently"></div>
        <div class="mini-map-body">
          <canvas id="mini-map" width="156" height="156"></canvas>
          <div class="mini-map-compass-slot">
            <div class="compass-tilt" aria-label="Compass heading">
              <div id="compass-rose" class="compass-rose" aria-hidden="true">
                <span class="compass-arrow compass-arrow-n"></span>
                <span class="compass-arrow compass-arrow-e"></span>
                <span class="compass-arrow compass-arrow-s"></span>
                <span class="compass-arrow compass-arrow-w"></span>
              </div>
              <div id="compass-heading" class="compass-heading">N</div>
            </div>
          </div>
        </div>
        <div id="mini-map-goto" class="mini-map-goto" data-hud-widget-interactive></div>
        <button class="hud-resize-handle" type="button" aria-label="Resize minimap" data-hud-resize="miniMap"></button>
      </div>
      <div id="professor-widget" class="professor-widget hud-widget" data-hud-widget="professor">
        <div class="hud-drag-grip" aria-hidden="true"></div>
        <button
          id="professor-open"
          class="professor-face-button"
          type="button"
          aria-label="The Professor. Nothing learning right now. Press to open the knowledge tree."
        >
          <span class="professor-face" aria-hidden="true">
            <canvas id="professor-canvas" class="professor-canvas"></canvas>
          </span>
        </button>
        <span id="professor-learning-status" class="professor-learning-status" hidden></span>
        <button
          id="professor-collapse"
          class="hud-collapse-toggle"
          type="button"
          aria-label="Hide the Professor"
          aria-pressed="false"
        ></button>
      </div>
      <div id="scrapbook-dock" class="scrapbook-dock" aria-label="Scrapbook">
        <div id="scrapbook-strip" class="scrapbook-strip" aria-hidden="true">
          <div id="scrapbook-tabs" class="scrapbook-tabs" role="tablist" aria-label="Scrapbook sections"></div>
          <div id="scrapbook-panel" class="scrapbook-strip-body" role="tabpanel" tabindex="0"></div>
        </div>
        <button id="scrapbook-toggle" class="scrapbook-cover" type="button" aria-label="Open scrapbook" aria-expanded="false" aria-controls="scrapbook-strip"></button>
      </div>
      <div id="thing-maker-panel" class="thing-maker-panel" aria-label="Thing Maker console" aria-hidden="true">
        <div class="maker-panel-header">
          <div>
            <p class="panel-kicker">Manual Thing Maker</p>
            <h1>Plan Slot Console</h1>
          </div>
          <button class="icon-button" type="button" data-close-maker aria-label="Close Thing Maker">×</button>
        </div>
        <p id="maker-message" class="maker-message"></p>
        <div class="maker-meter" aria-label="Craft progress">
          <div id="maker-progress" class="maker-progress"></div>
        </div>
        <div class="maker-grid">
          <section>
            <h2>Plans</h2>
            <div id="maker-recipes" class="recipe-list"></div>
          </section>
          <section>
            <h2>Materials</h2>
            <div id="maker-inventory" class="inventory-list"></div>
            <button id="maker-upgrade" class="upgrade-button" type="button">Upgrade crankworks</button>
          </section>
        </div>
        <div id="maker-output" class="maker-output"></div>
      </div>
      <aside id="seed-store-panel" class="seed-store-panel" aria-label="Pip’s Seed and Garden shop" aria-hidden="true">
        <header class="seed-store-header">
          <div>
            <p class="panel-kicker">Pip the chipmunk keeps the counter</p>
            <h1>Pip’s Seed &amp; Garden</h1>
          </div>
          <button class="icon-button" type="button" data-close-seed-store aria-label="Close Pip’s Seed and Garden">×</button>
        </header>
        <div class="seed-store-ledger">
          <strong id="seed-store-balance">Your pouch · ₡0</strong>
          <span>Flat prices. Barter is always welcome.</span>
        </div>
        <p id="seed-store-message" class="seed-store-message" aria-live="polite"></p>
        <section class="seed-store-section">
          <div class="seed-store-section-heading">
            <h2>Seed shelf</h2>
            <span>One seed per packet</span>
          </div>
          <div id="seed-store-stock" class="seed-store-stock"></div>
        </section>
        <section class="seed-store-section seed-store-basket">
          <div class="seed-store-section-heading">
            <h2>Your basket</h2>
            <span>Pip buys gathered things and garden harvests</span>
          </div>
          <div id="seed-store-basket"></div>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
